name: vk-practice2-but

services:
  postgres:
    image: postgres:17
    command: [postgres, -c, wal_level=logical, -c, max_replication_slots=4, -c, max_wal_senders=4]
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank_demo
      POSTGRES_DB: bank
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U bank -d bank]
      interval: 5s
      retries: 30

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka:/var/lib/kafka/data

  connect:
    image: quay.io/debezium/connect:3.1.2.Final
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: bank-connect
      CONFIG_STORAGE_TOPIC: bank_connect_configs
      OFFSET_STORAGE_TOPIC: bank_connect_offsets
      STATUS_STORAGE_TOPIC: bank_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
      VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'
      HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - 127.0.0.1:18083:8083

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: demo_admin
      MINIO_ROOT_PASSWORD: demo_password
    volumes:
      - minio:/data
    ports:
      - 127.0.0.1:19001:9001

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on: [minio]
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        until mc alias set local http://minio:9000 demo_admin demo_password;
        do sleep 2; done;
        mc mb --ignore-existing local/warehouse

  catalog-init:
    image: tabulario/iceberg-rest:1.6.0
    user: root
    entrypoint: [sh, -c, 'chown iceberg:iceberg /catalog']
    volumes:
      - catalog:/catalog

  rest:
    image: tabulario/iceberg-rest:1.6.0
    depends_on:
      minio-init:
        condition: service_completed_successfully
      catalog-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: demo_admin
      AWS_SECRET_ACCESS_KEY: demo_password
      AWS_REGION: us-east-1
      CATALOG_URI: jdbc:sqlite:/catalog/catalog.db
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: 'true'
    volumes:
      - catalog:/catalog

  worker:
    build: ./worker
    depends_on: [kafka, rest]
    volumes:
      - ./evidence:/evidence
      - worker-lock:/lock
    profiles: [tools]

  trino:
    image: trinodb/trino:476
    depends_on: [rest]
    volumes:
      - ./trino/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
    ports:
      - 127.0.0.1:18080:8080

volumes:
  postgres:
  kafka:
  minio:
  catalog:
  worker-lock:
